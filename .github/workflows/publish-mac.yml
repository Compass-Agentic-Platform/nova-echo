# Nova Echo — macOS Signed Release Publisher
#
# Builds, signs, notarises, staples and uploads the macOS (Apple Silicon)
# distribution of Nova Echo (a Tauri 2 / Rust app). The source is never
# committed to this repository: it is cloned at build time from Azure DevOps.
#
# ============================================================
# REQUIRED GITHUB SECRETS (environment: nova-echo-build)
# ============================================================
#
#   NOVA_ECHO_REPO            Full clone URL of the Azure DevOps source repo,
#                             including an embedded PAT for private access.
#                             Format: https://<pat>@dev.azure.com/oakpeak-devops/Kore/_git/nova-echo
#
#   MAC_CSC_LINK              Base64-encoded .p12 "Developer ID Application"
#                             certificate. Generate with:
#                               base64 -i certificate.p12 | tr -d '\n'
#
#   MAC_CSC_KEY_PASSWORD      Password protecting the .p12 certificate file.
#
#   APPLE_ID                  Apple ID email address used for notarisation.
#
#   APPLE_ID_PASSWORD         App-specific password for the Apple ID above.
#
#   APPLE_TEAM_ID             10-character Apple Developer Team ID.
#
# ============================================================
# ECHO-SPECIFIC CONSTRAINTS
# ============================================================
#
#   * The computer-control bundle (src-tauri/resources/computer-macos) is
#     pinned by manifest.json, whose SHA-256 is compiled into the app and whose
#     file hashes are checked at runtime. runtime/node is the official Node.js
#     build (already Developer ID signed) and is never re-signed. The committed
#     helper/desktop-helper is verified unsigned against manifest.json, then
#     signed here (hardened runtime + timestamp) BEFORE the app is built; its
#     new hash is written into helper/helper-manifest.json and manifest.json so
#     build.rs compiles the signed hashes into the app.
#
#   * runtime/node is gitignored (>100 MB). It is restored from the official
#     Node.js darwin-arm64 archive and must match the hash in manifest.json.
#
#   * Tauri updater signatures (.sig / signed latest.json) are NOT produced; this
#     workflow publishes the notarised DMG and zipped .app only.
#
# ============================================================
# HOW TO TRIGGER
# ============================================================
#
#   A GitHub Release must already exist. Actions → "Publish macOS (Signed)" →
#   "Run workflow" → optionally choose the source branch/tag and Node version.
#
# ============================================================

name: Publish macOS (Signed)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build from the source repository'
        required: false
        default: 'master'
        type: string
      node_version:
        description: 'Node.js version bundled as computer-macos/runtime/node (must match manifest.json)'
        required: false
        default: '24.14.1'
        type: string

env:
  SOURCE_DIR: source-app
  COMPUTER_DIR: source-app/src-tauri/resources/computer-macos
  TARGET: aarch64-apple-darwin
  ARCH: arm64

concurrency:
  group: publish-mac-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-mac:
    name: Build, sign, notarise & upload (arm64)
    runs-on: macos-latest
    environment: nova-echo-build

    steps:
      # ── 0. Checkout the release repo (for scripts + entitlements) ──────────
      - name: Checkout release repository
        uses: actions/checkout@v4

      # ── 1. Validate required secrets before doing any work ─────────────────
      - name: Validate required secrets
        shell: bash
        env:
          NOVA_ECHO_REPO: ${{ secrets.NOVA_ECHO_REPO }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=()
          [ -z "$NOVA_ECHO_REPO" ]        && MISSING+=("NOVA_ECHO_REPO")
          [ -z "$MAC_CSC_LINK" ]          && MISSING+=("MAC_CSC_LINK")
          [ -z "$MAC_CSC_KEY_PASSWORD" ]  && MISSING+=("MAC_CSC_KEY_PASSWORD")
          [ -z "$APPLE_ID" ]              && MISSING+=("APPLE_ID")
          [ -z "$APPLE_ID_PASSWORD" ]     && MISSING+=("APPLE_ID_PASSWORD")
          [ -z "$APPLE_TEAM_ID" ]         && MISSING+=("APPLE_TEAM_ID")
          if [ ${#MISSING[@]} -gt 0 ]; then
            for secret in "${MISSING[@]}"; do
              echo "::error::Required secret is not set: $secret"
            done
            exit 1
          fi
          echo "All required secrets are present."

      # ── 2. Clone the source repository from the secret URL ─────────────────
      - name: Clone source repository
        shell: bash
        env:
          NOVA_ECHO_REPO: ${{ secrets.NOVA_ECHO_REPO }}
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          BRANCH="${BRANCH:-master}"
          echo "Cloning branch '$BRANCH' from Azure DevOps…"
          git clone --depth 1 --branch "$BRANCH" "$NOVA_ECHO_REPO" "$SOURCE_DIR"
          ls -la "$SOURCE_DIR/"

      # ── 3. Toolchains: Rust, Node ──────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source-app/package-lock.json

      - name: Install npm dependencies
        shell: bash
        run: npm ci
        working-directory: source-app

      # ── 4. Restore and verify the pinned computer-macos bundle ─────────────
      - name: Restore bundled Node runtime and verify manifest
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="${{ github.event.inputs.node_version }}"
          NODE_VERSION="${NODE_VERSION:-24.14.1}"
          test -f "$COMPUTER_DIR/manifest.json" || { echo "::error::$COMPUTER_DIR/manifest.json is missing; run scripts/prepare-macos.sh in the source repo"; exit 1; }

          WORK="$(mktemp -d)"
          ARCHIVE="node-v$NODE_VERSION-darwin-arm64.tar.gz"
          BASE="https://nodejs.org/dist/v$NODE_VERSION"
          curl -fsSL --retry 3 -o "$WORK/$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL --retry 3 -o "$WORK/SHASUMS256.txt" "$BASE/SHASUMS256.txt"
          (cd "$WORK" && grep " $ARCHIVE\$" SHASUMS256.txt | shasum -a 256 -c -)
          tar -xzf "$WORK/$ARCHIVE" -C "$WORK"
          mkdir -p "$COMPUTER_DIR/runtime"
          cp "$WORK/node-v$NODE_VERSION-darwin-arm64/bin/node" "$COMPUTER_DIR/runtime/node"
          chmod 755 "$COMPUTER_DIR/runtime/node"
          rm -rf "$WORK"

          # Every file must match the manifest the app is compiled against,
          # and nothing unlisted may be shipped.
          python3 - "$COMPUTER_DIR" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          files = json.loads((root / "manifest.json").read_text())["files"]
          bad = [p for p, h in files.items()
                 if not (root / p).is_file() or hashlib.sha256((root / p).read_bytes()).hexdigest() != h]
          present = {str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()} - {"manifest.json"}
          extra = sorted(present - set(files))
          if bad or extra:
              raise SystemExit(f"computer-macos does not match manifest. mismatched={bad} unlisted={extra}")
          print(f"computer-macos matches manifest ({len(files)} files)")
          PY

      # ── 5. Prepare the macOS icon ──────────────────────────────────────────
      - name: Prepare macOS icon
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-mac-icon.js "$SOURCE_DIR/src-tauri"
          test -s "$SOURCE_DIR/src-tauri/icons/icon.icns"

      # ── 6. Patch tauri.conf.json for macOS bundling ────────────────────────
      - name: Configure macOS bundle (tauri.conf.json)
        shell: bash
        run: |
          set -euo pipefail
          cp assets/macos-entitlements.plist "$SOURCE_DIR/src-tauri/macos-entitlements.plist"
          python3 - "$SOURCE_DIR/src-tauri/tauri.conf.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          cfg = json.loads(open(p, encoding="utf-8").read())
          cfg["bundle"]["targets"] = ["app"]
          cfg["bundle"]["icon"] = ["icons/icon.png", "icons/icon.icns"]
          # Keep the source's minimumSystemVersion and Info.plist usage strings.
          mac = cfg["bundle"].setdefault("macOS", {})
          mac["entitlements"] = "macos-entitlements.plist"
          mac["hardenedRuntime"] = True
          open(p, "w", encoding="utf-8").write(json.dumps(cfg, indent=2) + "\n")
          print("Patched tauri.conf.json → targets=app, icns icon, entitlements, hardened runtime")
          PY

      # ── 7. Import the Apple certificate into a temporary keychain ──────────
      - name: Import Apple signing certificate
        id: import-cert
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_FILE="$(mktemp /tmp/certificate.XXXXXX.p12)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$CERT_FILE"

          KEYCHAIN_DIR="$(mktemp -d)"
          KEYCHAIN_PATH="$KEYCHAIN_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | tr -d '"')"
          security default-keychain -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -oE '"Developer ID Application[^"]*"' | head -1 | sed 's/"//g')"
          test -n "$IDENTITY" || { echo "::error::No 'Developer ID Application' identity found"; exit 1; }
          echo "Resolved signing identity: $IDENTITY"

          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          rm -f "$CERT_FILE"

      # ── 7b. Sign the pinned helper and re-pin its hashes before building ───
      - name: Sign desktop helper and update manifests
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.import-cert.outputs.identity }}
        run: |
          set -euo pipefail
          HELPER="$COMPUTER_DIR/helper/desktop-helper"
          test -f "$HELPER" || { echo "::error::$HELPER is missing"; exit 1; }
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$HELPER"
          codesign --verify --strict --verbose=2 "$HELPER"

          # Only the helper and its manifest change; every other entry stays
          # pinned to the committed bytes verified in step 4.
          python3 - "$COMPUTER_DIR" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          sha = lambda p: hashlib.sha256((root / p).read_bytes()).hexdigest()
          hm_path = root / "helper/helper-manifest.json"
          hm = json.loads(hm_path.read_text())
          hm["sha256"] = sha("helper/desktop-helper")
          hm_path.write_text(json.dumps(hm, separators=(",", ":")))
          m_path = root / "manifest.json"
          m = json.loads(m_path.read_text())
          for p in ("helper/desktop-helper", "helper/helper-manifest.json"):
              if p not in m["files"]:
                  raise SystemExit(f"{p} is not listed in manifest.json")
              m["files"][p] = sha(p)
          m_path.write_text(json.dumps(m, indent=2) + "\n")
          print(f"Re-pinned signed helper: {hm['sha256']}")
          PY

      - name: Check bundled native code is notarisation-ready
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            INFO="$(codesign -dvv "$f" 2>&1)" || { echo "::error::Unsigned binary: $f"; FAILED=1; continue; }
            echo "$INFO" | grep -q 'Authority=Developer ID Application' || { echo "::error::Not Developer ID signed: $f"; FAILED=1; }
            echo "$INFO" | grep -q 'flags=.*runtime' || { echo "::error::Hardened runtime missing: $f"; FAILED=1; }
            echo "$INFO" | grep -q '^Timestamp=' || { echo "::error::Secure timestamp missing: $f"; FAILED=1; }
            codesign --verify --strict "$f" || { echo "::error::Signature invalid: $f"; FAILED=1; }
          done < <(find "$COMPUTER_DIR" -type f -print0)
          [ "$FAILED" -eq 0 ] || exit 1
          echo "All bundled Mach-O binaries are Developer ID signed."

      # ── 8. Build and sign with Tauri (notarisation deferred to step 9) ─────
      - name: Build, sign and bundle (Tauri)
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.import-cert.outputs.identity }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          # Call the CLI directly: the npm "tauri" script loads .env files.
          npx tauri build --target "$TARGET" --bundles app

      - name: Sign app and verify pinned resources are untouched
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.import-cert.outputs.identity }}
        run: |
          set -euo pipefail
          APP_DIR="$SOURCE_DIR/src-tauri/target/$TARGET/release/bundle/macos"
          APP_BUNDLE="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_BUNDLE" || { echo "::error::No .app bundle produced"; exit 1; }

          # Re-seal the outer bundle only (no --deep): nested pinned binaries
          # keep their own signatures and exact bytes.
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
            --options runtime --entitlements assets/macos-entitlements.plist "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

          BUNDLED="$APP_BUNDLE/Contents/Resources/resources/computer-macos"
          test -f "$BUNDLED/manifest.json" || { echo "::error::computer-macos missing from app bundle"; exit 1; }
          python3 - "$BUNDLED" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          files = json.loads((root / "manifest.json").read_text())["files"]
          bad = [p for p, h in files.items()
                 if not (root / p).is_file() or hashlib.sha256((root / p).read_bytes()).hexdigest() != h]
          if bad:
              raise SystemExit(f"Signing altered pinned files: {bad}")
          print(f"Bundled computer-macos still matches manifest ({len(files)} files)")
          PY

      # ── 9. Notarise and staple both the .app and the DMG ───────────────────
      - name: Notarise and staple (.app + DMG)
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ steps.import-cert.outputs.identity }}
        run: |
          set -euo pipefail
          APP_DIR="$SOURCE_DIR/src-tauri/target/$TARGET/release/bundle/macos"
          DMG_DIR="$SOURCE_DIR/src-tauri/target/$TARGET/release/bundle/dmg"
          APP_BUNDLE="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_BUNDLE" || { echo "::error::No .app bundle produced"; exit 1; }
          mkdir -p "$DMG_DIR"
          DMG_FILE="$DMG_DIR/Nova-Echo-mac-$ARCH.dmg"

          NOTARY_DIR="$(mktemp -d)"
          trap 'rm -rf "$NOTARY_DIR"' EXIT

          notarise() {
            local submission="$1"
            local result="$NOTARY_DIR/result.json"
            local submit_exit=0
            echo "Submitting $(basename "$submission") for notarisation…"
            xcrun notarytool submit "$submission" \
              --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --output-format json > "$result" || submit_exit=$?
            cat "$result"
            local status id
            status="$(jq -r '.status // empty' "$result")"
            id="$(jq -r '.id // empty' "$result")"
            if [ "$submit_exit" -ne 0 ] || [ "$status" != "Accepted" ]; then
              if [ -n "$id" ]; then
                xcrun notarytool log "$id" \
                  --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                  || echo "::warning::Could not retrieve notarisation log"
              fi
              echo "::error::Notarisation did not succeed (status: ${status:-unknown}, exit: $submit_exit)"
              exit 1
            fi
          }

          # notarytool accepts ZIP archives, not raw .app directories.
          APP_ZIP="$NOTARY_DIR/app-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$APP_ZIP"
          notarise "$APP_ZIP"
          xcrun stapler staple "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"

          # Build the DMG from the stapled app, then sign, notarise and staple it.
          mkdir -p "$NOTARY_DIR/dmg-root"
          ditto "$APP_BUNDLE" "$NOTARY_DIR/dmg-root/$(basename "$APP_BUNDLE")"
          ln -s /Applications "$NOTARY_DIR/dmg-root/Applications"
          hdiutil create -volname "Nova Echo" -srcfolder "$NOTARY_DIR/dmg-root" \
            -ov -format UDZO "$DMG_FILE"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_FILE"
          codesign --verify --strict "$DMG_FILE"
          notarise "$DMG_FILE"
          xcrun stapler staple "$DMG_FILE"
          xcrun stapler validate "$DMG_FILE"

          spctl --assess --type execute --verbose=2 "$APP_BUNDLE"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_FILE"

      # ── 9b. Install from the DMG like a user and run the sidecar's helper check ─
      # /Applications is root:admin 0775 on every Mac; the computer service must
      # accept it. Screenshots need user-granted permissions, so they stay manual.
      - name: Smoke test /Applications install
        shell: bash
        run: |
          set -euo pipefail
          DMG_FILE="$SOURCE_DIR/src-tauri/target/$TARGET/release/bundle/dmg/Nova-Echo-mac-$ARCH.dmg"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG_FILE" -nobrowse -readonly -mountpoint "$MOUNT"
          APP_NAME="$(basename "$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)")"
          INSTALLED="/Applications/$APP_NAME"
          rm -rf "$INSTALLED"
          ditto "$MOUNT/$APP_NAME" "$INSTALLED"
          hdiutil detach "$MOUNT"
          trap 'rm -rf "$INSTALLED"' EXIT
          ls -ld /Applications
          R="$INSTALLED/Contents/Resources/resources/computer-macos"
          cat > "$RUNNER_TEMP/smoke.mjs" <<'EOF'
          import {createHash} from 'node:crypto';import {readFileSync} from 'node:fs';import {pathToFileURL} from 'node:url';
          const [dist,helper]=process.argv.slice(2);
          const {verifyPrivateMacOSHelper}=await import(pathToFileURL(dist+'/macos-private-launcher.js').href);
          const hash=createHash('sha256').update(readFileSync(helper+'/helper-manifest.json')).digest('hex');
          console.log('Helper check passed:',await verifyPrivateMacOSHelper(helper,hash));
          EOF
          "$R/runtime/node" "$RUNNER_TEMP/smoke.mjs" "$R/dist" "$R/helper" \
            || { echo "::error::Computer service rejects the app installed in /Applications"; exit 1; }

      # ── 10. Stage cleanly-named release artifacts ──────────────────────────
      - name: Prepare release artifacts
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./$SOURCE_DIR/package.json').version")"
          APP_DIR="$SOURCE_DIR/src-tauri/target/$TARGET/release/bundle/macos"
          DMG_DIR="$SOURCE_DIR/src-tauri/target/$TARGET/release/bundle/dmg"
          APP_BUNDLE="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          DMG_FILE="$DMG_DIR/Nova-Echo-mac-$ARCH.dmg"

          STAGING="$(mktemp -d)"
          DMG_OUT="$STAGING/Nova-Echo-$VERSION-mac-$ARCH.dmg"
          ZIP_OUT="$STAGING/Nova-Echo-$VERSION-mac-$ARCH.zip"
          cp "$DMG_FILE" "$DMG_OUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$ZIP_OUT"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG_OUT" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP_OUT" >> "$GITHUB_OUTPUT"
          echo "Staged $DMG_OUT and $ZIP_OUT"

      # ── 11. Upload artifacts to the latest GitHub Release ──────────────────
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/${{ github.repository }}/releases/latest" 2>/dev/null)" || {
            echo "::error::No GitHub Release found. Create a release before running this workflow."
            exit 1
          }
          TAG="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"
          echo "Uploading to latest release: $TAG"
          gh release upload "$TAG" "${{ steps.prepare.outputs.dmg }}" "${{ steps.prepare.outputs.zip }}" --clobber

      # ── 12. Clean up the temporary keychain ────────────────────────────────
      - name: Clean up keychain
        if: always()
        shell: bash
        run: |
          KEYCHAIN_PATH="${{ steps.import-cert.outputs.keychain_path }}"
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
