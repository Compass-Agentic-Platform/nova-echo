name: Feature request
description: Suggest an idea for Nova Echo
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your request related to a problem?
      description: A clear description of the problem or gap this would solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Nova Echo to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternatives or workarounds you have already tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this relate to?
      options:
        - Chat / task execution
        - Voice conversation / microphone / playback
        - Screen sharing / screenshots
        - Mouse / keyboard / computer control
        - Applications / windows / allowed folders
        - Approvals / remembered permissions
        - Compass connection / models / tools
        - Settings / credentials
        - Installer / updater
        - Other
